; NASCAR Team Racing - GlobalVR  -  nascar_settings.ini
; Edit, then start the game with NascarLaunch.exe. Full details: Docs\NASCAR_CONTROLS.md

[Display]
; Race resolution (0 / 0 = screen size). Fullscreen needs a mode your monitor supports.
Width=0
Height=0
Fullscreen=false
; Borderless window that fills the screen (overrides Fullscreen). Default: on, so the
; race fills your screen. Set false + Fullscreen=true for exclusive fullscreen instead.
Borderless=true
; Menus' renderer: auto (what works on this PC), opengl or directx.
Renderer=auto

[Cabinet]
; Attract music volume 0-100. SimpleAttract=1 shortens the attract loop.
MusicVolume=70
SimpleAttract=0

[Launcher]
; shell = full arcade front end, race = straight into the [Race] below (testing).
Mode=shell
WaitForExit=true

[Race]
; Only used when Mode=race.
; Tracks: BRISTOL DAYTONA INDIANAPOLIS LOWES PHOENIX TALLADEGA
Track=DAYTONA
; Series: 2005NEXTEL 2004NEXTEL 2004NNS 2004CTS (empty = the game default)
Series=2005NEXTEL
; Car number as written on the car, leading zero included (01 = Nemechek, 1 = Truex).
Car=10
Laps=3
; Extra switches for every race.
ExtraArgs=-noabort -notimeout

[Controller]
; Gamepad in a race. Actions: view lookback start music horn shiftup shiftdown quit none
; Buttons: cross circle square triangle l1 r1 l2 r2 options share l3 r3 dup ddown dleft dright
; (Xbox names work too: a b x y lb rb start back ...; Switch: l r zl zr minus plus home).
; Pedals: triggers, or rightstick (up = gas, down = brake - for the Switch Pro's on/off ZL/ZR).
Pedals   = triggers
L1       = lookback
R1       = view
Options  = start
Circle   = horn
Square   = shiftup
Triangle = shiftdown
DRight   = music
DDown    = quit

[Frontend]
; Gamepad in the menus. Actions: select back operator up down left right none
Cross    = select
Circle   = back
Options  = operator
DUp      = up
DDown    = down
DLeft    = left
DRight   = right

[Wheel]
; Wheel, pedals, shifter and button boxes are set up automatically - just plug them in.
; Change a value below only if the log's "controls:" line ([Debug] Log) shows a wrong guess.
; ForceFeedback: arcade (the cabinet's own effects), shim (simple spring + damper), off.
ForceFeedback = arcade
; Gas and brake the wrong way round? SwapPedals = true.
SwapPedals = false
; auto, or an axis: x y z rx ry rz slider0 slider1. Pedals: auto, separate, combined (one axis).
Steering = x
Gas      = auto
Brake    = auto
Pedals   = auto
; Force a device by part of its name (names: the log's "controllers:" lines). ShifterDevice = none: no shifter.
Device        =
PedalDevice   =
ShifterDevice =
ButtonBox1    =
; auto (learned: held gear = H-pattern, taps = sequential), h or sequential.
ShifterMode   = auto
; Rotation 0 = the wheel's own range. 270 (with DeviceRange = the driver's setting) = arcade-quick.
Rotation    = 0
DeviceRange = 900
; ButtonN = a pad button above (cross circle ... dup); [Debug] Log shows each button's number.

[Debug]
; true = write diagnostic logs to a LOG folder in the install root (troubleshooting
; only; off for normal play). Reproduce the problem ONCE with it on, then zip the LOG
; folder for a bug report. What lands in LOG\:
;   nascarlaunch.log            - your PC config (CPU, motherboard, GPU + driver
;                                 version, OS build, RAM, display) + the launch timeline
;   gvrioshim-<exe>-<pid>.log   - the GvrIO shim in the shell and the race, with a
;                                 native crash filter (faulting module+offset)
;   gvrsqlite-<exe>.log         - the database layer + any .NET crash in the shell
;   aklog-AMPlayer.log          - Team Racing menus: script errors and exceptions
;   debug-output.log            - the menus' and the race's own messages (how far they got)
;   race-trace*.txt             - the race engine's trace of each race in the session
Log=false
