; =============================================================================
;  NASCAR GVR - settings
; =============================================================================
;
;  How to use: change a value after the "=", save, start the game.
;  Lines starting with ";" are notes - the game skips them.
;  true / false turn an option on or off.
;  Help: github.com/iGThomas/NASCAR_GVR
;
; =============================================================================


[Display]
; -----------------------------------------------------------------------------
;  Display - the race picture
; -----------------------------------------------------------------------------

; Race size in pixels. 0 = the size of your screen.
Width  = 0
Height = 0

; A window without borders that covers the whole screen (recommended):
; instant Alt+Tab, and your desktop resolution stays as it is.
Borderless = true

; Real fullscreen instead. Only with Borderless = false, and only with a size
; your monitor supports.
Fullscreen = false

; How the menus are drawn: auto (picks what works on this PC), opengl or directx.
Renderer = auto

; Race text size (place, lap, speed, lap times).
;   auto = grows with your screen, like the rest of the race display
;   original = the arcade's sizes, small on big screens
;   a number such as 1.5 = that many times the arcade's size
HudText = auto

; Which graphics chip runs the game on a PC with two (most gaming laptops):
;   auto = the high-performance one, unless you chose one in Windows' Graphics settings
;   high / low = always the high-performance / power-saving one
;   windows = let Windows decide
Gpu = auto

; A compatibility helper for old Direct3D (DDrawCompat) for the menus:
;   auto = only when this PC fails the menus' graphics tests, on = always, off = never
DDrawCompat = auto


[Graphics]
; -----------------------------------------------------------------------------
;  Graphics - race details, applied at every start
; -----------------------------------------------------------------------------

; Always use the most detailed car models (NASCAR Racing).
; Looks better up close, needs a little more graphics power.   Arcade: false
MaxCarDetail = false

; Largest paint the computer cars may use, in pixels. 0 = no limit.
; 0 also keeps custom paint jobs from crashing the race.        Arcade: 512
AITextureSize = 0

; Car reflections: 0 = off, 1 = on.
EnvironmentMap = 0

; Compressed textures: 1 = on, 0 = off (sharper, uses more graphics memory).
CompressedTextures = 1

; Lighting: 0 = none, 1 = basic, 2 = with shine, 3 = with shine and reflections.
DynamicLighting = 3

; How many cars are drawn at once: 5 to 48.
MaxVisibleCars = 39


[Cabinet]
; -----------------------------------------------------------------------------
;  Cabinet - arcade extras
; -----------------------------------------------------------------------------

; Music volume of the attract (demo) screens: 0 to 100.
MusicVolume = 70

; Shorter attract loop: 1 = on, 0 = off.
SimpleAttract = 0

; NASCAR Racing: 19 more drivers from the disc, next to the original 12.
; Replace their pictures in Shell\Textures\Faces, Names and Numbers if you like.
ExtraDrivers = true


[Launcher]
; -----------------------------------------------------------------------------
;  Launcher - what starts
; -----------------------------------------------------------------------------

; shell = the full arcade menus.  race = straight into the [Race] below (testing).
Mode = shell

; Stay open until the game closes (needed for the borderless window).
WaitForExit = true

; Prevents a start-up freeze of the menus on some PCs. Leave on.
SafeStart = true

; How the menus get the game's fixes. auto = they load them themselves.
; inject = the older way, for support only.
Preload = auto


[Race]
; -----------------------------------------------------------------------------
;  Race - for races started without the menus
;  ([Launcher] Mode = race, or [Multiplayer] Mode = host)
; -----------------------------------------------------------------------------

; Track: BRISTOL, DAYTONA, INDIANAPOLIS, LOWES, PHOENIX, TALLADEGA
Track = DAYTONA

; Series: 2005NEXTEL, 2004NEXTEL, 2004NNS, 2004CTS. Empty = the game's choice.
Series = 2005NEXTEL

; Car number as painted on the car, leading zero included (01 = Nemechek, 1 = Truex).
Car = 10

; Number of laps. In the arcade lobby the race length comes from the server cabinet.
Laps = 3

; Extra start options, used for every race (also from the menus). Advanced.
ExtraArgs = -noabort -notimeout


[Multiplayer]
; -----------------------------------------------------------------------------
;  Multiplayer - race other players online. Works as it is.
;  More: github.com/iGThomas/NASCAR_GVR (docs/MULTIPLAYER.md)
; -----------------------------------------------------------------------------

; Your name, shown to the other players in the Lobby and on your car.
; Up to 15 letters. Empty = "Driver 1", "Driver 2", ...
PlayerName =

; Who you race with:
;   empty  = the public lobby - anyone online
;   a name = a private lobby  - give your friends the same name
Room =

; How online play works:
;   lobby       = players online can join you in the menus and race together;
;                 alone you race as usual (NASCAR Racing)
;   off         = never online
;   host / join = straight into a race without the menus (see Players below)
Mode = lobby

; The server that connects the players.
Relay = nascar.furioussteel.net:22600

; host only - ignored in the lobby, which always takes up to 10 players.
; How many players the host waits for, including you (2 to 10); "Start now" starts
; earlier. Track, series and laps come from [Race].
Players = 2

; join on the same home network without a server (Relay empty): the host PC's IP address.
HostAddress =


[Controller]
; -----------------------------------------------------------------------------
;  Controller - gamepad buttons in a race
; -----------------------------------------------------------------------------

; Buttons: cross circle square triangle l1 r1 l2 r2 options share l3 r3 dup ddown dleft dright
;          (Xbox: a b x y lb rb start back ...   Switch: l r zl zr minus plus home)
; Actions: view lookback start music horn shiftup shiftdown quit none

; Gas and brake: triggers, or rightstick (up = gas, down = brake - for the Switch Pro).
Pedals   = triggers

L1       = lookback
R1       = view
Options  = start
Circle   = horn
Square   = shiftup
Triangle = shiftdown
DRight   = music
DDown    = quit


[Frontend]
; -----------------------------------------------------------------------------
;  Frontend - gamepad buttons in the menus
; -----------------------------------------------------------------------------

; Actions: select back operator up down left right none
Cross    = select
Circle   = back
Options  = operator
DUp      = up
DDown    = down
DLeft    = left
DRight   = right


[Wheel]
; -----------------------------------------------------------------------------
;  Wheel - steering wheels, pedals, shifters, button boxes
; -----------------------------------------------------------------------------

; Everything is set up automatically - just plug it in. Change a value only if the
; log ([Debug] Log = true, line "controls:") shows a wrong guess.

; Force feedback: arcade (the arcade's own effects), shim (simple spring), off.
ForceFeedback = arcade

; Gas and brake the wrong way round? Set true.
SwapPedals = false

; Axes: auto, or x y z rx ry rz slider0 slider1.
; Pedals: auto, separate (two axes) or combined (one axis).
Steering = x
Gas      = auto
Brake    = auto
Pedals   = auto

; Use a device by part of its name (names: the log's "controllers:" lines).
; ShifterDevice = none means no shifter.
Device        =
PedalDevice   =
ShifterDevice =
ButtonBox1    =

; Shifter: auto (learns it: held gear = H-pattern, taps = sequential), h or sequential.
ShifterMode = auto

; Steering range in degrees. 0 = the wheel's own setting.
; 270 (with DeviceRange = your wheel driver's setting) = quick, arcade-like.
Rotation    = 0
DeviceRange = 900

; Extra wheel buttons: ButtonN = a button name from [Controller] (the log shows each number).


[Debug]
; -----------------------------------------------------------------------------
;  Debug - logs for a bug report
; -----------------------------------------------------------------------------

; true = write logs to the LOG folder. Turn on, make the problem happen once,
; then zip the LOG folder and send it. Leave off for normal play.
Log = false
